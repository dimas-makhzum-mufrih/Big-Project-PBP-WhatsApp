<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ngumpul - Ruang Chat</title>
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--warna-utama:#0293bd;--warna-utama-hover:#0082a6;--bg-putih:#fff;--bg-abu-terang:#f4f7f9;--bg-abu-input:#f0f2f5;--teks-gelap:#111b21;--teks-redup:#667781;--bub-kirim:#d9fdd3;--bub-terima:#fff;--border-warna:#e9edef}
*{box-sizing:border-box}body{margin:0;padding:0;overflow:hidden;background:var(--bg-abu-terang);color:var(--teks-gelap);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.dashboard-container{display:flex;width:100vw;height:100vh;background:#fff}.sisi-kiri{width:32%;min-width:320px;max-width:450px;background:#fff;border-right:1px solid var(--border-warna);display:flex;flex-direction:column;position:relative}
.header-kiri{height:65px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border-warna)}.header-kiri h2{font-size:1.4rem;font-weight:700;margin:0}
.menu-wa-style{position:relative}.btn-menu-titik3{background:none;border:0;color:var(--teks-redup);cursor:pointer;padding:8px;border-radius:50%;display:flex;align-items:center;justify-content:center}.btn-menu-titik3:hover{background:var(--bg-abu-input)}
.dropdown-box{position:absolute;top:45px;right:0;background:#fff;box-shadow:0 4px 16px #00000014;border:1px solid var(--border-warna);border-radius:8px;width:210px;z-index:200;padding:6px 0}.dropdown-option{padding:12px 20px;cursor:pointer;font-size:.95rem}.dropdown-option:hover{background:var(--bg-abu-terang)}
.search-box-wrapper{padding:12px 16px}.search-bar-input{width:100%;background:var(--bg-abu-input);border:0;border-radius:8px;padding:10px 16px;font-size:.9rem}.search-bar-input:focus{outline:2px solid var(--warna-utama)}
.chat-scroll-area{flex:1;overflow-y:auto}.chat-card{display:flex;align-items:center;padding:14px 20px;cursor:pointer;border-bottom:1px solid var(--border-warna);transition:background .2s}.chat-card:hover,.chat-card.aktif{background:var(--bg-abu-terang)}
.circle-avatar{width:48px;height:48px;flex:0 0 48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;margin-right:16px;color:#fff;font-size:1.1rem}.card-meta{flex:1;overflow:hidden}.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}.card-title{font-weight:600;font-size:1rem}.card-preview{color:var(--teks-redup);font-size:.88rem;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sisi-kanan{flex:1;background:var(--bg-abu-terang);display:flex;position:relative;min-width:0}.welcome-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;color:var(--teks-redup);text-align:center;background:#f8fafc;padding:20px}.welcome-screen h2{color:var(--warna-utama);margin-bottom:10px;font-size:1.8rem}
.active-chat-room{display:none;flex-direction:column;width:100%;height:100%;background:#efeae2}.active-chat-header{height:65px;flex-shrink:0;background:#fff;display:flex;align-items:center;padding:0 20px;border-bottom:1px solid var(--border-warna);gap:14px}.active-header-info h3{margin:0;font-size:1.05rem;font-weight:600}.active-header-info p{margin:2px 0 0;font-size:.8rem;color:var(--warna-utama)}
.messages-container{flex:1;padding:24px 6%;overflow-y:auto;display:flex;flex-direction:column;gap:12px}.chat-bubble{max-width:65%;padding:10px 14px;border-radius:8px;font-size:.95rem;line-height:1.4;display:flex;flex-direction:column;overflow-wrap:anywhere;box-shadow:0 1px 1px #0000000f}.chat-bubble.kirim{background:var(--bub-kirim);align-self:flex-end;border-top-right-radius:0}.chat-bubble.terima{background:var(--bub-terima);align-self:flex-start;border-top-left-radius:0}.timestamp{font-size:.7rem;color:var(--teks-redup);align-self:flex-end;margin-top:5px}
.active-chat-footer{height:65px;flex-shrink:0;background:#fff;display:flex;align-items:center;padding:0 20px;gap:16px;border-top:1px solid var(--border-warna)}.chat-input-field{flex:1;min-width:0;background:var(--bg-abu-input);border:0;border-radius:8px;padding:12px 18px;font-size:.95rem}.chat-input-field:focus{outline:2px solid var(--warna-utama)}.send-action-btn{background:var(--warna-utama);border:0;color:#fff;padding:10px 20px;border-radius:8px;cursor:pointer;font-weight:600}.send-action-btn:hover{background:var(--warna-utama-hover)}
.settings-slide-panel{position:absolute;inset:0;background:#fff;z-index:300;display:none;flex-direction:column}.settings-panel-header{height:65px;flex-shrink:0;background:var(--warna-utama);display:flex;align-items:center;padding:0 20px;gap:16px;color:#fff}.settings-back-btn{background:none;border:0;color:#fff;cursor:pointer;font-size:1.3rem;font-weight:bold}.settings-list-flow{flex:1;overflow-y:auto;padding:8px 0}.settings-row-item{display:flex;align-items:center;padding:16px 24px;cursor:pointer;justify-content:space-between;border-bottom:1px solid var(--border-warna)}.settings-row-item:hover{background:var(--bg-abu-terang)}.settings-item-left{display:flex;align-items:center;gap:16px}.settings-item-icon{font-size:1.3rem}.settings-item-text b{display:block;font-size:1rem;font-weight:600;margin-bottom:2px}.settings-item-text small{color:var(--teks-redup);font-size:.85rem}.settings-arrow{color:var(--teks-redup);font-weight:bold}.settings-logout-btn{margin:24px;padding:14px;background:#fff5f5;color:#e53e3e;border:1px solid #fed7d7;border-radius:8px;cursor:pointer;text-align:center;font-weight:600;font-size:1rem}.settings-logout-btn:hover{border-color:#e53e3e}
.settings-item-icon{width:28px;text-align:center;color:var(--warna-utama)}
.settings-row-item{cursor:default;pointer-events:none}
.settings-logout-btn{pointer-events:auto}
@media(max-width:700px){.sisi-kiri{width:100%;min-width:0;max-width:none}.sisi-kanan{display:none}.sisi-kiri.room-open{display:none}.sisi-kanan.room-open{display:flex}}
</style>
</head>
<body>
<div class="dashboard-container">
<aside class="sisi-kiri" id="panel-sisi-kiri">
<div class="header-kiri"><h2>Obrolan</h2><div class="menu-wa-style">
<button class="btn-menu-titik3" id="trigger-menu-utama" aria-label="Buka Menu"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg></button>
<div class="dropdown-box" id="box-dropdown-utama" style="display:none"><div class="dropdown-option" id="opt-buka-setelan">Pengaturan</div><div class="dropdown-option"></div><div class="dropdown-option"></div><div class="dropdown-option"></div><div class="dropdown-option"></div></div>
</div></div>
<div class="search-box-wrapper"><input class="search-bar-input" id="input-cari-chat" type="search" placeholder="Cari atau mulai chat baru"></div>
<div class="chat-scroll-area">
</div>
</aside>
<main class="sisi-kanan" id="panel-sisi-kanan">
<div class="welcome-screen" id="panel-chat-kosong"><h2>Selamat Datang di Ngumpul</h2><p>Pilih salah satu teman di sebelah kiri untuk mulai melakukan obrolan.<br>Menu setelan dan keluar dapat diakses melalui tombol titik tiga.</p></div>
<section class="active-chat-room" id="panel-chat-aktif">
<header class="active-chat-header"><div class="circle-avatar" id="avatar-header-kanan" style="margin:0;background:#3984bd">Z</div><div class="active-header-info"><h3 id="nama-header-kanan">Nama Kontak</h3><p>online</p></div></header>
<div class="messages-container" id="box-list-pesan"></div>
<footer class="active-chat-footer"><input class="chat-input-field" id="input-teks-kirim" type="text" placeholder="Ketik pesan..." autocomplete="off"><button class="send-action-btn" id="btn-kirim-pesan">Kirim</button></footer>
</section>
<div class="settings-slide-panel" id="panel-layer-setelan">
<header class="settings-panel-header"><button class="settings-back-btn" id="btn-kembali-ke-chat" aria-label="Kembali">←</button><strong>Pengaturan</strong></header>
<div class="settings-list-flow">
 <button class="settings-logout-btn" id="btn-keluar-akun">
  <i class="fa-solid fa-right-from-bracket"></i> Keluar akun
</button>
</div></div>
</main>
</div>
<script>
const triggerMenuUtama=document.getElementById('trigger-menu-utama'),
boxDropdownUtama=document.getElementById('box-dropdown-utama'),
optBukaSetelan=document.getElementById('opt-buka-setelan'),
panelLayerSetelan=document.getElementById('panel-layer-setelan'),
btnKembaliKeChat=document.getElementById('btn-kembali-ke-chat');

triggerMenuUtama.addEventListener('click',e=>{e.stopPropagation();boxDropdownUtama.style.display=boxDropdownUtama.style.display==='none'?'block':'none'});
document.addEventListener('click',()=>{boxDropdownUtama.style.display='none'});
optBukaSetelan.addEventListener('click',()=>{panelLayerSetelan.style.display='flex';boxDropdownUtama.style.display='none'});
btnKembaliKeChat.addEventListener('click',()=>{panelLayerSetelan.style.display='none'});

document.getElementById('btn-keluar-akun').addEventListener('click',()=>{
    try{localStorage.clear();sessionStorage.clear()}catch(e){}
    window.location.href='../assets/index.html?splash=none';
});
</script>
</body>
</html>
