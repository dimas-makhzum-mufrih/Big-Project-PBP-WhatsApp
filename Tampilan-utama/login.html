<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Masuk ke Ngumpul - Chat, grup, dan telepon</title>
    <link rel="stylesheet" href="login_style.css" />
  </head>
  <body>
    <div class="layar mode-form" id="layar">
      <aside class="hero">

        <div class="logo">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/>
            <circle cx="8.5" cy="12" r="1.2" class="isi-titik" />
            <circle cx="12" cy="12" r="1.2" class="isi-titik" />
            <circle cx="15.5" cy="12" r="1.2" class="isi-titik" />
          </svg>
        </div>
        <h1>Ngumpul</h1>
        <p class="tagline">
          Ngobrol, bikin grup, dan telepon teman dalam satu aplikasi.
        </p>

        <ul class="fitur">
          <li>
            <svg class="ikon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/></svg>
            Chat pribadi dan grup kelas
          </li>
          <li>
            <svg class="ikon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
            Ruang suara buat belajar bareng
          </li>
          <li>
            <svg class="ikon" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            Telepon suara dan video
          </li>
        </ul>
      </aside>

      <main class="isi">
        <section class="halaman aktif" id="form-login">
          <a class="kembali" href="../assets/index.html?halaman=dashboard">
            <svg class="ikon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M15 18l-6-6 6-6" />
            </svg>
            Kembali
          </a>
          <h2>Masuk ke Ngumpul</h2>
          <p class="sub">Silakan masuk dengan akun yang sudah terdaftar</p>

          <label for="login-identifier">Email atau Nomor HP</label>
          <input
            type="text"
            id="login-identifier"
            placeholder="Masukkan Email atau Nomor HP"
            autocomplete="username"
          />
          <div class="error" id="error-login-identifier"></div>

          <label for="login-sandi">Sandi</label>
          <div class="kolom-sandi">
            <input
              type="password"
              id="login-sandi"
              placeholder="Masukkan kata sandi Anda"
              autocomplete="current-password"
            />
            <button type="button" class="lihat" data-target="login-sandi">
              Lihat
            </button>
          </div>
          <div class="error" id="error-login-sandi"></div>

          <button type="button" class="tombol">Masuk</button>

          <p class="bawah">
            Belum punya akun?
            <a href="../assets/index.html?halaman=form-daftar&splash=none">Daftar sekarang</a>
          </p>
        </section>
      </main>
    </div>

    <div id="toast"></div>

    <script src="../assets/js/foto.js"></script>
    <script src="storage.js"></script>
    <script src="login.js"></script>
  </body>
</html>
