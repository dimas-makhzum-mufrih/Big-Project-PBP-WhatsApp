<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Ngumpul - Tautan Media Sosial</title>
    <link rel="stylesheet" href="edit-profile.css">
</head>
<body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></symbol>
        <symbol id="i-edit" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></symbol>
        <symbol id="i-plus" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></symbol>
        <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></symbol>
    </svg>

    <div class="profile-container">
        <header class="profile-header">
            <div class="header-left">
                <button class="btn-back" id="btn-back-profile" aria-label="Kembali"><svg class="ikon"><use href="#i-back"/></svg></button>
                <h2>Tautan media sosial</h2>
            </div>
        </header>

        <main class="profile-content">
            <div class="profile-card-wrapper">
                <p class="social-desc">Tambahkan tautan agar orang lain dapat menemukanmu di platform lain[cite: 13].</p>
                
                <!-- Daftar Wadah Tautan (Bisa bertambah dinamis via JS) -->
                <div class="info-list-card" id="social-links-container">
                    <div class="info-row-item social-item">
                        <span class="account-item-icon"><svg class="ikon"><use href="#i-globe"/></svg></span>
                        <div class="info-row-text">
                            <span class="field-title">Instagram</span>
                            <input type="text" class="social-input-field" value="instagram.com/username">
                        </div>
                        <svg class="ikon info-arrow"><use href="#i-edit"/></svg>
                    </div>

                    <div class="info-row-item social-item">
                        <span class="account-item-icon"><svg class="ikon"><use href="#i-globe"/></svg></span>
                        <div class="info-row-text">
                            <span class="field-title">Facebook</span>
                            <input type="text" class="social-input-field" value="facebook.com/username">
                        </div>
                        <svg class="ikon info-arrow"><use href="#i-edit"/></svg>
                    </div>

                    <div class="info-row-item social-item">
                        <span class="account-item-icon"><svg class="ikon"><use href="#i-globe"/></svg></span>
                        <div class="info-row-text">
                            <span class="field-title">LinkedIn</span>
                            <input type="text" class="social-input-field" value="linkedin.com/in/username">
                        </div>
                        <svg class="ikon info-arrow"><use href="#i-edit"/></svg>
                    </div>

                    <div class="info-row-item social-item">
                        <span class="account-item-icon"><svg class="ikon"><use href="#i-globe"/></svg></span>
                        <div class="info-row-text">
                            <span class="field-title">TikTok</span>
                            <input type="text" class="social-input-field" value="tiktok.com/@username">
                        </div>
                        <svg class="ikon info-arrow"><use href="#i-edit"/></svg>
                    </div>
                </div>

                <!-- Tombol Tambahkan Tautan -->
                <button class="btn-add-social" id="btn-add-social">
                    <svg class="ikon"><use href="#i-plus"/></svg> Tambahkan tautan
                </button>
            </div>
        </main>
    </div>
    <script src="social-links.js"></script>
</body>
</html>
