<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verifikasi akun - Ngumpul</title>
  <link rel="stylesheet" href="../../assets/css/variables.css">
  <link rel="stylesheet" href="otp.css">
  
  <script src="../../assets/js/theme.js"></script>
</head>
<body>
<main class="kartu">
  <button class="kembali" id="btn-kembali" type="button">&larr; Kembali</button>
  <h1>Masukkan kode verifikasi</h1>
  <p class="sub">Kami mengirim kode 6 angka ke <b id="nomor-tersamar">nomor HP kamu</b>.</p>

  <div class="kotak-otp" id="kotak-otp" role="group" aria-label="Kode OTP 6 angka">
    <input class="digit" inputmode="numeric" maxlength="1" autocomplete="one-time-code" aria-label="Angka 1">
    <input class="digit" inputmode="numeric" maxlength="1" aria-label="Angka 2">
    <input class="digit" inputmode="numeric" maxlength="1" aria-label="Angka 3">
    <input class="digit" inputmode="numeric" maxlength="1" aria-label="Angka 4">
    <input class="digit" inputmode="numeric" maxlength="1" aria-label="Angka 5">
    <input class="digit" inputmode="numeric" maxlength="1" aria-label="Angka 6">
  </div>
  <div class="pesan" id="pesan" role="alert"></div>

  <button class="tombol" id="btn-verifikasi" type="button" disabled>Verifikasi</button>
  <p class="ulang">
    <span id="info-timer">Kirim ulang kode dalam <b id="detik">60</b> detik</span>
    <button class="tautan" id="btn-kirim-ulang" type="button" hidden>Kirim ulang kode</button>
  </p>
  <p class="kadaluarsa" id="info-kadaluarsa"></p>
</main>

<div id="notif" aria-live="polite"></div>
<script src="otp.js"></script>
</body>
</html>
