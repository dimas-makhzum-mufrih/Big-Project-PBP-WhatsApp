<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verifikasi akun - Ngumpul</title>
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="../../assets/css/variables.css">
  <link rel="stylesheet" href="../../assets/css/themes.css">
  <link rel="stylesheet" href="otp.css">
  <link rel="stylesheet" href="../../assets/css/auth.css">
  <script src="../../assets/js/theme.js"></script>
</head>

<body>
  <main class="kartu">
    <a class="kembali" href="login.html">&larr; Kembali ke login</a>
    <h1>Verifikasi email</h1>
    <p class="sub">Masukkan kode 6 angka yang dikirim ke <b id="email-verifikasi"></b>. Kode berlaku 10 menit.</p>

    <form id="verifikasi-email" method="post">
      <label for="otp">Kode verifikasi</label>
      <input class="otp" id="otp" name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
        autocomplete="one-time-code" aria-describedby="error-otp" required>
      <p class="auth-notice" id="status-otp" role="status"></p>
      <p class="auth-error" id="error-otp" role="alert"></p>

      <button class="tombol" id="btn-verifikasi" type="submit">Verifikasi</button>
      <button class="tautan" id="btn-kirim-ulang" type="button">Kirim ulang kode</button>
    </form>
  </main>

  <script src="../../assets/js/auth.js"></script>
  <script src="../../assets/js/auth-form.js"></script>
  <script src="otp.js"></script>
</body>

</html>
