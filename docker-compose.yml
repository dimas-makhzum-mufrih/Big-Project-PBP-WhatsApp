name: ngumpul-client

services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NGUMPUL_WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 5s

  cloudflared:
    image: cloudflare/cloudflared:${NGUMPUL_CLOUDFLARED_TAG:-2026.11.2}
    restart: unless-stopped
    profiles: ["tunnel"]
    user: "${NGUMPUL_TUNNEL_UID:-65532}:${NGUMPUL_TUNNEL_GID:-65532}"
    command: ["tunnel", "--no-autoupdate", "--config", "/etc/cloudflared/config.yml", "run", "${NGUMPUL_TUNNEL_ID:-}"]
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./cloudflared/config.yml
        target: /etc/cloudflared/config.yml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${NGUMPUL_TUNNEL_CREDENTIALS:-./cloudflared/credentials.json}
        target: /etc/cloudflared/credentials.json
        read_only: true
        bind:
          create_host_path: false
