map $sent_http_content_type $client_cache_control {
    ~^text/html "public, no-cache, no-transform";
    default "no-cache";
}

server {
    listen 80 default_server;
    server_name _;
    root /srv/ngumpul;
    index index.html;

    add_header Cache-Control $client_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
